# WorkBuddy Manager —— Docker Compose 部署（一个栈：面板 + 网关）
#
# 用法：
#   1) 首次准备网关数据目录与配置（compose 不会自动创建，config.json 必须是文件，
#      否则 docker 会把它建成目录、网关起不来）：
#        mkdir -p workbuddy2api-data/auths workbuddy2api-data/data
#        cp gateway/config.example.json workbuddy2api-data/config.json
#      （发布包里网关源码在 upstream/：cp upstream/config.example.json ...）
#   2) 按需修改下面的环境变量
#   3) docker compose up -d --build
#   4) 浏览器打开 http://<服务器IP>:7864
#      首次启动若未设 WB_ADMIN_PASSWORD，会随机生成密码并打印到容器日志：
#      docker compose logs workbuddy-manager | grep -A2 密码
#
# 拓扑：**只有面板对外**（127.0.0.1:7864）。网关 `workbuddy2api` 只在 compose
# 内网，面板经服务名 http://workbuddy2api:7863 访问它——不映射宿主端口。
#
# ── 多账号池分组：必须保留，不要压成单实例 ─────────────────────
# 上游支持把账号按「分组」拆到多个实例上跑（server/upstreamsvc.py 决定每个分组
# 用哪个实例名/端口）。本文件只起**默认分组**的网关实例；要加额外分组，另建一个
# `docker-compose.override.yml`，照着下面 workbuddy2api 复制一份起第二个实例
# （例如 workbuddy2api-b，容器内监听 7863、映射宿主 127.0.0.1:7865），再在面板的
# 「上游」设置里把该分组指向 http://workbuddy2api-b:7863（或对应的实例名）。
# **不要**为了“简化”把所有分组塞进同一个实例——那会改变分组语义。
#
# 与宿主机安装（deploy/install.sh + systemd）的区别，见 Dockerfile 顶部说明。
# 简述：容器版**能**在界面上更新上游 —— 镜像内置了 docker CLI 与 compose 插件，
# 挂上 docker.sock 后即可在容器内重建上游容器（见下方 volumes 的说明）。
# 不挂 docker.sock 时那几项会降级为「请到宿主机操作」，界面如实提示。

services:
  # ── 网关（Go 反代）：仅 compose 内网 ──────────────────────────
  workbuddy2api:
    # 仓库内开发目录是 gateway/；发布包内会被改名为 upstream/（见 release.yml）。
    build: ./gateway
    container_name: workbuddy2api
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    volumes:
      # auths/ 与 data/ 用本地目录（与面板共享同一份，见下方 workbuddy-manager）。
      # 网关以 app(uid 10001) 读写，宿主目录属主不对会「0 个账号」，必要时：
      #   chown -R 10001:10001 workbuddy2api-data/auths workbuddy2api-data/data
      - ./workbuddy2api-data/auths:/app/auths
      - ./workbuddy2api-data/data:/app/data
      # config.json 只读：面板负责写，网关重启后读取（改动需重启网关才生效）。
      - ./workbuddy2api-data/config.json:/app/config.json:ro
    # 不写 ports：网关持有账号池凭据，只允许面板经内网按服务名访问。
    networks:
      - workbuddy

  # ── 面板（管理端）：唯一对外入口 ──────────────────────────────
  workbuddy-manager:
    build:
      context: .
      # 可选：Debian 软件源镜像。
      #
      # 官方源（deb.debian.org）走 Fastly CDN，中国大陆访问实测**频繁 502 且极慢**
      # （约 367 kB/s，常在下载某个 .deb 时中断），构建会在第 2 步 "apt-get update"
      # 直接失败——表现就是镜像建不出来、容器起不来、页面 ERR_CONNECTION_REFUSED。
      #
      # Dockerfile 里已内置一次自动降级（官方源失败自动改阿里云重试），所以多数情况
      # 不配也能建成功，只是会先白等一轮。想完全避免等待就把下面两行取消注释，
      # 或临时用命令行覆盖：
      #   docker compose build --build-arg DEBIAN_MIRROR=mirrors.aliyun.com
      #
      # 可选镜像：mirrors.aliyun.com / mirrors.tuna.tsinghua.edu.cn / mirrors.ustc.edu.cn
      args:
        DEBIAN_MIRROR: ""
        # 可选：PyPI 镜像（成因同上——官方源走国际 CDN，国内会抖动/失败）。
        # 留空 = 官方源，失败时 Dockerfile 会自动降级到清华镜像重试。
        # 可选镜像：https://pypi.tuna.tsinghua.edu.cn/simple / https://mirrors.aliyun.com/pypi/simple
        PIP_INDEX_URL: ""
        # 可选：npm 依赖镜像。**只在需要容器内构建前端时用得上**（即工作区
        # 没有 web/out 的情况，如 git clone 部署）。成因与上面两个相同——
        # 官方 registry 国内访问慢且会断。
        #   docker compose build --build-arg NPM_REGISTRY=https://registry.npmmirror.com
        NPM_REGISTRY: ""
        # 可选：镜像里要装 docker CLI（供容器内「重载上游 / 读上游日志 / 一键更新」用），
        # 它的静态包固定从 download.docker.com 取——国外 CDN，国内实测很慢，
        # 构建会长时间停在这一步。填国内镜像基址可绕开。
        # 可选值：https://mirrors.aliyun.com/docker-ce / https://mirrors.tuna.tsinghua.edu.cn/docker-ce
        DOCKER_CLI_BASE: ""
        # 可选：compose 插件从 GitHub Releases 下载（官方地址国内会超时）。
        # 用法是「加速前缀 + 原始 URL」，例如 https://ghfast.top/
        COMPOSE_URL_PREFIX: ""
        # 可选：子路径部署前缀（如 /workbuddy-manager）。留空 = 部署在根路径。
        #
        # 容器版的前端是**构建期**编译进镜像的，所以前缀必须在 build 时传进来；
        # 与下面 environment 里的 WB_BASE_PATH 取值必须一致。
        #   docker compose build --build-arg BASE_PATH=/workbuddy-manager
        BASE_PATH: ""
    image: workbuddy-manager:latest
    container_name: workbuddy-manager
    # 这个 restart 策略是容器版「一键更新」能生效的前提：
    # 更新完成后容器内的进程会退出，靠它用新代码重新拉起。
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 首启管理员密码；不设则随机生成并打印到日志（推荐首启后立即改）
      # WB_ADMIN_PASSWORD: "改成你的强密码"
      # 上游地址：本栈内直接按 compose 服务名访问同一网络里的网关（无需宿主端口）。
      WB2API_BASE: http://workbuddy2api:7863
      # 可选：子路径部署前缀，必须与上面 build.args.BASE_PATH 完全一致（留空则都不填）。
      # 服务端用它补回响应里漏掉的站内地址，并在反代保留前缀时把前缀剥掉。
      # 详见 deploy/README.md 的「子路径部署」。
      # WB_BASE_PATH: /workbuddy-manager
      # 反向代理在后面时，真实 IP 取自它覆盖写入的 X-Real-IP
      WB_TRUST_PROXY: "1"
      # 生产环境不暴露 /docs 与 /openapi.json
      WB_ENABLE_DOCS: "0"
      # 上游数据文件的容器内路径保持默认：AUTH_DIR=/opt/workbuddy2api/auths、
      # UPSTREAM_CONFIG=/opt/workbuddy2api/config.json、UPSTREAM_DIR=/opt/workbuddy2api。
      # 下面把本地 workbuddy2api-data/ 整体挂到 /opt/workbuddy2api，于是面板读写的
      # 正是网关用的同一份 config.json 与 auths/（账号管理因此继续可用）。
    ports:
      # **只监听本机**：管理端必须藏在反向代理之后。
      # 若确需直接从别的机器访问，改成 "7864:7864"，但请先确保有 HTTPS 与访问控制——
      # 管理端持有全部账号凭据，直接暴露到公网是被打穿的常见原因。
      - "127.0.0.1:7864:7864"
    volumes:
      # 数据库、日志、更新状态、上游版本固定标记都在这里。
      # 必须持久化，否则重建容器会丢失统计与审计记录。
      #
      # **权限提示（issue #30）**：bind mount 的目录属主由宿主机决定，镜像内的
      # chown 不起作用。docker 首次自动创建 ./data 时归 root，而容器以 uid 10001
      # 运行 —— 结果是启动时报 `sqlite3.OperationalError: unable to open database
      # file`（那个报错既不说路径也不说原因，很容易误以为是路径配错了）。
      # 宿主机在 compose 所在目录执行一次即可：
      #   chown -R 10001:10001 ./data
      # 若目录在网络文件系统（NFS/SMB）上、改不了属主，改用命名卷：
      #   volumes:
      #     - wb-manager-data:/app/data
      #   # 文件末尾另加：
      #   volumes:
      #     wb-manager-data:
      - ./data:/app/data
      # 网关的**数据目录**（auths/ + data/ + config.json），与上面的 workbuddy2api
      # 挂的是宿主机上同一份目录：
      #   · 读/写 config.json —— 管理端「设置」页保存的目标
      #   · 读/写 auths/ —— 扫码添加账号会落盘 workbuddy-<uid>.json（见
      #     tencent.write_auth_file），所以**不能只读**
      # 容器内路径 /opt/workbuddy2api 与 WB_UPSTREAM_DIR / WB_AUTH_DIR /
      # WB_UPSTREAM_CONFIG 的默认值一致，无需额外设环境变量。
      #
      # **权限提示（与上游 issue #108 同款问题）**：bind mount 的目录属主由宿主机
      # 决定，镜像内的 chown 不起作用。若管理端显示「0 个账号」而 auths 里明明有
      # 文件，或添加账号报权限错误，通常是跨 uid 读写不到——宿主机执行一次：
      #   chown -R 10001:10001 ./workbuddy2api-data/auths
      # （10001 是网关容器内进程的 uid，管理端也用同一 uid，见 Dockerfile）
      - ./workbuddy2api-data:/opt/workbuddy2api
      # docker 控制套接字：挂上后容器内的管理端可以像宿主部署那样操作上游容器
      # （保存设置后自动重载 / 读上游日志 / 一键更新上游）。
      #
      # **安全性说明（值得读）**：挂 docker.sock 等于把宿主 root 权限交给本容器。
      # 但这**不是新增的风险等级**——宿主部署时本服务本来就是 root 运行
      # （systemd 单元无 User=、安装脚本要求 root），而 root 进程本来就能
      # `docker run -v /:/host` 拿到宿主文件系统。两者权限等价。
      #
      # 若你的要求是最小权限，把下面这行注释掉即可：此时依赖 docker 的功能会
      # 自动降级为「请到宿主机执行 docker compose ...」，界面如实提示，不会
      # 静默失败。
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7864/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - workbuddy

# 显式声明一个 bridge 网络：两个服务都接入，面板即可按服务名 workbuddy2api 解析。
# （不依赖 compose 的隐式 default 网络，读起来也更清楚。）
networks:
  workbuddy:
    driver: bridge
